<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello B world 3D</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1020;
        color: #f5f7ff;
      }

      #hero {
        position: relative;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      #scene-container {
        position: absolute;
        inset: 0;
      }

      .overlay {
        position: relative;
        z-index: 1;
        padding: 2rem;
        text-align: center;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }

      main section + section {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="hero" aria-label="3D Hero Scene">
        <div id="scene-container"></div>
        <div class="overlay">
          <h1>First side: 3D Hello B world</h1>
          <p>Kameran roterar runt texten.</p>
        </div>
      </section>

      <section>
        <p>Scrolla vidare till resten av sidan.</p>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
